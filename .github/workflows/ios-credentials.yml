# Sets up iPhone signing for any new part of the app (an "app extension", such as the
# Live Activity widget) using the App Store Connect API key. Run it once after the app
# gains a new extension, or after changing an App ID's capabilities in the Apple portal:
#   Actions → "iOS credentials" → Run workflow
#
# Store builds run with --non-interactive, which can reuse signing credentials but never
# create them. `eas credentials:configure-build` can, but it asks questions; this answers
# each with its default ("Reuse this distribution certificate?" yes, "Generate a new
# provisioning profile?" yes) through a pseudo-terminal.
name: iOS credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Set up the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Add the ASC_API_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID secrets and the APPLE_TEAM_ID variable."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key"
          {
            echo "EXPO_ASC_API_KEY_PATH=$key"
            echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION"
          } >> "$GITHUB_ENV"

      - name: Set up signing for the app and its extensions
        run: |
          # eas finishes the setup but keeps listening for keypresses and never exits, so stop
          # it after a while and judge by its own "ready" line.
          set +o pipefail
          yes "" | timeout 600 script -qefc "eas credentials:configure-build --platform ios --profile production" /dev/null | tee "$RUNNER_TEMP/eas.log" | grep -v '^\s*$' || true
          if grep -q "All credentials are ready to build" "$RUNNER_TEMP/eas.log"; then
            echo "::notice title=Done::iPhone signing is set up. Run the Mobile build again."
          else
            echo "::error title=Signing setup failed::See the log above. If it mentions App Groups, check the App Group is assigned to both App IDs in the Apple Developer portal."
            exit 1
          fi
