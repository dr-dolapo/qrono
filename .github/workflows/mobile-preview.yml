# Publishes the mobile app to Expo for every pull request that changes it, and comments
# a QR code on the pull request. Scan it with Expo Go to try the change on your phone.
#
# Merges to main publish to:
#   main                  Expo Go (the QR code in apps/mobile/README.md)
#   preview, production   installed builds (Android APK, TestFlight / App Store), which
#                         download it in the background and offer a restart. A build only
#                         gets updates matching its native code (app.config.js), so a
#                         change that needs a new build never reaches older ones.
#
# Needs: the EXPO_TOKEN repository secret, and the Expo project ID in apps/mobile/app.json.
# Until both are there, this workflow skips itself. See apps/mobile/README.md → "Previews".
name: Mobile preview

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-preview.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check Expo is set up
        id: setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          project_id=$(node -p "require('./app.json').expo.extra?.eas?.projectId ?? ''")
          if [ -z "$EXPO_TOKEN" ] || [ -z "$project_id" ]; then
            echo "::notice title=Mobile preview skipped::Add the EXPO_TOKEN secret and the Expo project ID to get a QR code here (apps/mobile/README.md → Previews)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - if: steps.setup.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - if: steps.setup.outputs.ready == 'true'
        run: npm ci

      - name: Publish and comment a QR code
        if: steps.setup.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          QRONO_EXPO_GO: "1"
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: apps/mobile
          command: eas update --auto --non-interactive
          qr-target: expo-go

      # The "main" channel is what the permanent QR code in apps/mobile/README.md opens,
      # so Expo Go always gets the latest merged app.
      - name: Publish main
        if: steps.setup.outputs.ready == 'true' && github.event_name == 'push'
        env:
          QRONO_EXPO_GO: "1"
        run: eas update --channel main --message "main @ ${GITHUB_SHA::7}" --non-interactive

      # Installed builds. Their runtime version is a fingerprint of the native code, so this
      # reaches only builds made from the same native code. Others wait for a new build.
      - name: Update installed builds
        if: steps.setup.outputs.ready == 'true' && github.event_name == 'push'
        run: |
          for channel in preview production; do
            eas update --channel "$channel" --message "main @ ${GITHUB_SHA::7}" --non-interactive
          done
